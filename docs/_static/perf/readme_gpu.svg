<svg xmlns="http://www.w3.org/2000/svg" width="732" height="232" viewBox="0 0 732 232" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="t">Kepler orbits, adaptive RKF7(8), 1,000,000 samples, spread</title>
<desc id="d">Wall time on NVIDIA H100 NVL: eagle.simulate 48.9 ms, NVIDIA Warp 113 ms, PyTorch with torch.compile 811 ms, JAX 1.24 s, CuPy 9.34 s.</desc>
<style>.bg{fill:#fcfcfb;stroke:#e1e0d9}.ink{fill:#0b0b0b}.sub{fill:#52514e}.bar{fill:#9a9992}.us{fill:#7d53dc}
.c0{fill:#cf416b}
.c1{fill:#6d9f09}
.c2{fill:#df5345}
.c3{fill:#0e9d9b}
.c4{fill:#157b21}
</style>
<rect class="bg" x="0.5" y="0.5" width="731" height="231" rx="8"/>
<g transform="translate(16,16)">
<text class="ink" x="0" y="22" font-size="16" font-weight="600">Kepler orbits, adaptive RKF7(8), 1,000,000 samples, spread</text>
<text class="sub" x="0" y="42" font-size="12.5">NVIDIA H100 NVL. Log scale, 30.5 ms to 14.9 s.</text>
<circle class="c0" cx="5" cy="66" r="4.5"/><text class="ink" x="18" y="71" font-size="14">eagle.simulate</text><rect class="us" x="150" y="59" width="36.4" height="14" rx="3"/><text class="ink" x="194.4" y="71" font-size="13">48.9 ms</text>
<circle class="c1" cx="5" cy="96" r="4.5"/><text class="ink" x="18" y="101" font-size="14">NVIDIA Warp</text><rect class="bar" x="150" y="89" width="101.3" height="14" rx="3"/><text class="ink" x="259.3" y="101" font-size="13">113 ms</text>
<circle class="c2" cx="5" cy="126" r="4.5"/><text class="ink" x="18" y="131" font-size="14">PyTorch with torch.compile</text><rect class="bar" x="150" y="119" width="254.1" height="14" rx="3"/><text class="ink" x="412.1" y="131" font-size="13">811 ms</text>
<circle class="c3" cx="5" cy="156" r="4.5"/><text class="ink" x="18" y="161" font-size="14">JAX</text><rect class="bar" x="150" y="149" width="286.8" height="14" rx="3"/><text class="ink" x="444.8" y="161" font-size="13">1.24 s</text>
<circle class="c4" cx="5" cy="186" r="4.5"/><text class="ink" x="18" y="191" font-size="14">CuPy</text><rect class="bar" x="150" y="179" width="443.6" height="14" rx="3"/><text class="ink" x="601.6" y="191" font-size="13">9.34 s</text>
</g>
</svg>
