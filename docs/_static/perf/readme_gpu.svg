<svg xmlns="http://www.w3.org/2000/svg" width="732" height="232" viewBox="0 0 732 232" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="t">RK4 oscillators, 1,000,000 samples, spread (up to 1000 steps)</title>
<desc id="d">Wall time on NVIDIA H100 80GB HBM3: eagle.simulate 613 µs, NVIDIA Warp 1.54 ms, JAX 47.0 ms, PyTorch 336 ms, CuPy 368 ms.</desc>
<style>.bg{fill:#fcfcfb;stroke:#e1e0d9}.ink{fill:#0b0b0b}.sub{fill:#52514e}.bar{fill:rgba(127,126,120,.5)}.us{fill:#7d53dc}
.c0{fill:#cf416b}
.c1{fill:#6d9f09}
.c2{fill:#0e9d9b}
.c3{fill:#df5345}
.c4{fill:#157b21}
@media (prefers-color-scheme: dark){.bg{fill:#1a1a19;stroke:#2c2c2a}.ink{fill:#f2f2ee}.sub{fill:#c3c2b7}
.c1{fill:#b6fd13}
.c2{fill:#36fcd8}
.c3{fill:#eb7e61}
.c4{fill:#22d434}
}</style>
<rect class="bg" x="0.5" y="0.5" width="731" height="231" rx="8"/>
<g transform="translate(16,16)">
<text class="ink" x="0" y="22" font-size="16" font-weight="600">RK4 oscillators, 1,000,000 samples, spread (up to 1000 steps)</text>
<text class="sub" x="0" y="42" font-size="12.5">NVIDIA H100 80GB HBM3. Log scale, 383 µs to 589 ms.</text>
<circle class="c0" cx="5" cy="66" r="4.5"/><text class="ink" x="18" y="71" font-size="14">eagle.simulate</text><rect class="us" x="150" y="59" width="30.7" height="14" rx="3"/><text class="ink" x="188.7" y="71" font-size="13">613 µs</text>
<circle class="c1" cx="5" cy="96" r="4.5"/><text class="ink" x="18" y="101" font-size="14">NVIDIA Warp</text><rect class="bar" x="150" y="89" width="91.1" height="14" rx="3"/><text class="ink" x="249.1" y="101" font-size="13">1.54 ms</text>
<circle class="c2" cx="5" cy="126" r="4.5"/><text class="ink" x="18" y="131" font-size="14">JAX</text><rect class="bar" x="150" y="119" width="314.6" height="14" rx="3"/><text class="ink" x="472.6" y="131" font-size="13">47.0 ms</text>
<circle class="c3" cx="5" cy="156" r="4.5"/><text class="ink" x="18" y="161" font-size="14">PyTorch</text><rect class="bar" x="150" y="149" width="443.2" height="14" rx="3"/><text class="ink" x="601.2" y="161" font-size="13">336 ms</text>
<circle class="c4" cx="5" cy="186" r="4.5"/><text class="ink" x="18" y="191" font-size="14">CuPy</text><rect class="bar" x="150" y="179" width="449.3" height="14" rx="3"/><text class="ink" x="607.3" y="191" font-size="13">368 ms</text>
</g>
</svg>
