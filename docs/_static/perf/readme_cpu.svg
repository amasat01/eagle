<svg xmlns="http://www.w3.org/2000/svg" width="732" height="232" viewBox="0 0 732 232" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="t">RK4 oscillators, 1,000,000 samples, spread (up to 1000 steps)</title>
<desc id="d">Wall time on AMD EPYC 9B45: eagle, 8 threads 142 ms, Numba 328 ms, JAX 1.86 s, PyTorch 10.2 s, NumPy 15.3 s.</desc>
<style>.bg{fill:#fcfcfb;stroke:#e1e0d9}.ink{fill:#0b0b0b}.sub{fill:#52514e}.bar{fill:rgba(127,126,120,.5)}.us{fill:#7d53dc}
.c0{fill:#cf416b}
.c1{fill:#0f7da7}
.c2{fill:#0e9d9b}
.c3{fill:#df5345}
.c4{fill:#1e47b5}
@media (prefers-color-scheme: dark){.bg{fill:#1a1a19;stroke:#2c2c2a}.ink{fill:#f2f2ee}.sub{fill:#c3c2b7}
.c1{fill:#7fcdf0}
.c2{fill:#36fcd8}
.c3{fill:#eb7e61}
.c4{fill:#8aa3f2}
}</style>
<rect class="bg" x="0.5" y="0.5" width="731" height="231" rx="8"/>
<g transform="translate(16,16)">
<text class="ink" x="0" y="22" font-size="16" font-weight="600">RK4 oscillators, 1,000,000 samples, spread (up to 1000 steps)</text>
<text class="sub" x="0" y="42" font-size="12.5">AMD EPYC 9B45. Log scale, 88.7 ms to 24.4 s.</text>
<circle class="c0" cx="5" cy="66" r="4.5"/><text class="ink" x="18" y="71" font-size="14">eagle, 8 threads</text><rect class="us" x="150" y="59" width="40.2" height="14" rx="3"/><text class="ink" x="198.2" y="71" font-size="13">142 ms</text>
<circle class="c1" cx="5" cy="96" r="4.5"/><text class="ink" x="18" y="101" font-size="14">Numba</text><rect class="bar" x="150" y="89" width="111.8" height="14" rx="3"/><text class="ink" x="269.8" y="101" font-size="13">328 ms</text>
<circle class="c2" cx="5" cy="126" r="4.5"/><text class="ink" x="18" y="131" font-size="14">JAX</text><rect class="bar" x="150" y="119" width="260.2" height="14" rx="3"/><text class="ink" x="418.2" y="131" font-size="13">1.86 s</text>
<circle class="c3" cx="5" cy="156" r="4.5"/><text class="ink" x="18" y="161" font-size="14">PyTorch</text><rect class="bar" x="150" y="149" width="405.8" height="14" rx="3"/><text class="ink" x="563.8" y="161" font-size="13">10.2 s</text>
<circle class="c4" cx="5" cy="186" r="4.5"/><text class="ink" x="18" y="191" font-size="14">NumPy</text><rect class="bar" x="150" y="179" width="439.8" height="14" rx="3"/><text class="ink" x="597.8" y="191" font-size="13">15.3 s</text>
</g>
</svg>
