# SPDX-License-Identifier: Apache-2.0
#
# CI: the CPP_MODE arm (deps -> build:cpp -> test:cpp) plus a provisioned-toolchain build of the
# eagle._core python binding (test:python), and the core-only wheel on a
# runner with no NVIDIA driver and no CUDA toolkit (test-python-nodriver). The
# CUDA C++ arm (test:cuda) still needs a real GPU to RUN on and is not wired here.

name: CI

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-cpp:
    runs-on: ubuntu-latest
    env:
      CC: gcc-13
      CXX: g++-13
      # ccache: CMake reads the *_COMPILER_LAUNCHER variables, also under scikit-build-core
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
      CCACHE_COMPILERCHECK: content
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CMAKE_CUDA_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v7
        with:
          path: eagle

      # aether as a sibling checkout (amasat01/aether, main).
      - uses: actions/checkout@v7
        with:
          repository: amasat01/aether
          path: aether
          token: ${{ secrets.SIBLING_READ_TOKEN || github.token }}

      - run: sudo apt-get update && sudo apt-get install -y g++-13 ccache

      # compiled objects persist across runs; one cache per job and architecture
      - uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-v2-${{ runner.os }}-${{ runner.arch }}-test-cpp-${{ hashFiles('**/*.h', '**/*.hpp', '**/*.cpp', '**/*.cu', '**/*.cuh', '**/CMakeLists.txt') }}
          restore-keys: |
            ccache-v2-${{ runner.os }}-${{ runner.arch }}-test-cpp-
      - run: ccache -z

      # deps stage: install aether's headers (CPP_MODE) into a local prefix.
      - run: |
          cmake -DAETHER_CPP_MODE=ON \
            -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}/__install" \
            -B aether/build -S aether
          cmake --install aether/build

      # build:cpp, with the project's standard CPP_MODE configure variables.
      - run: |
          cd eagle
          cmake -B build \
            -DCMAKE_PREFIX_PATH="${GITHUB_WORKSPACE}/__install" \
            -DFETCHCONTENT_QUIET=ON \
            -DEAGLE_BUILD_TESTS=ON \
            -DEAGLE_TEST_REPORT=ON \
            -DEAGLE_DEBUG_MODE=ON \
            -DEAGLE_CPP_MODE=ON .
          cmake --build build -j"$(nproc)"

      # test:cpp — the manifest-backed integrity gate, not the binary bare.
      - run: cd eagle && tests/check_gate.sh cpp build/tests/eagle_tests
      - if: always()
        run: ccache -s

  # Sanitizer leg (host only): the CPP_MODE suite built with -fsanitize=address,undefined and run
  # through the manifest gate. Three checks keep it from going vacuously green: the runtime is
  # linked, the committed canary (tests/sanitize/canary.cpp) trips every mode, and the suite
  # count equals the manifest. CUDA-side coverage is the local `sanitize-gate`
  # (tests/sanitize/README.md).
  sanitize-cpp:
    runs-on: ubuntu-latest
    env:
      CC: gcc-13
      CXX: g++-13
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
      CCACHE_COMPILERCHECK: content
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v7
        with:
          path: eagle

      - uses: actions/checkout@v7
        with:
          repository: amasat01/aether
          path: aether
          token: ${{ secrets.SIBLING_READ_TOKEN || github.token }}

      - run: sudo apt-get update && sudo apt-get install -y g++-13 ccache

      - uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-v2-${{ runner.os }}-${{ runner.arch }}-sanitize-cpp-${{ hashFiles('**/*.h', '**/*.hpp', '**/*.cpp', '**/*.cu', '**/*.cuh', '**/CMakeLists.txt') }}
          restore-keys: |
            ccache-v2-${{ runner.os }}-${{ runner.arch }}-sanitize-cpp-
      - run: ccache -z

      # aether headers (CPP_MODE) into a local prefix, unsanitized: header-only.
      - run: |
          cmake -DAETHER_CPP_MODE=ON \
            -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}/__install" \
            -B aether/build -S aether
          cmake --install aether/build

      - run: |
          cd eagle
          cmake -B build \
            -DCMAKE_PREFIX_PATH="${GITHUB_WORKSPACE}/__install" \
            -DFETCHCONTENT_QUIET=ON \
            -DEAGLE_BUILD_TESTS=ON \
            -DEAGLE_DEBUG_MODE=ON \
            -DEAGLE_CPP_MODE=ON \
            -DEAGLE_SANITIZERS=address,undefined .
          cmake --build build -j"$(nproc)"

      # Non-vacuity (i): the binary must actually carry the ASan runtime.
      - name: sanitizer runtime is linked
        run: |
          cd eagle
          { nm -D build/tests/eagle_tests; nm build/tests/eagle_tests; } 2>/dev/null | grep -q __asan_init \
            || { echo "RED: eagle_tests carries no __asan_init — this job is not sanitizing"; exit 1; }

      # Non-vacuity (ii): each canary mode must exit non-zero AND print its banner.
      - name: canaries trip
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          cd eagle
          fail=0
          for pair in "heap-oob:AddressSanitizer: heap-buffer-overflow" \
                      "leak:LeakSanitizer: detected memory leaks" \
                      "uninit:runtime error: load of value" \
                      "shift-ub:runtime error: shift exponent"; do
            mode="${pair%%:*}"; banner="${pair#*:}"
            set +e; build/tests/eagle_canary "$mode" > canary.out 2>&1; rc=$?; set -e
            if [ "$rc" -eq 0 ] || ! grep -q "$banner" canary.out; then
              echo "RED: canary '$mode' rc=$rc, banner '$banner' present: $(grep -c "$banner" canary.out)"; cat canary.out; fail=1
            else
              echo "canary '$mode' tripped (rc=$rc)"
            fi
          done
          exit $fail

      # Non-vacuity (iii): the manifest gate, with the sanitizer environment.
      - name: suite under check_gate
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          cd eagle
          LSAN_OPTIONS="suppressions=$PWD/tests/sanitize/lsan.supp" tests/check_gate.sh cpp build/tests/eagle_tests
      - if: always()
        run: ccache -s

  # tsan-ft — eagle._core under ThreadSanitizer on a free-threaded CPython built
  # with --with-thread-sanitizer (cached per version + compiler), running the ft
  # rows. Green = the canary race is reported without our suppressions (the
  # detector reaches _core) AND the ft rows give zero reports with them. See
  # tests/sanitize/tsan_ft.sh and tests/sanitize/tsan.supp.
  tsan-ft:
    runs-on: ubuntu-latest
    env:
      CC: clang-18
      CXX: clang++-18
      TSAN_PY_VERSION: "3.14.8"
    steps:
      - uses: actions/checkout@v7
        with:
          path: eagle

      - uses: actions/checkout@v7
        with:
          repository: amasat01/aether
          path: aether
          token: ${{ secrets.SIBLING_READ_TOKEN || github.token }}

      - uses: actions/checkout@v7
        with:
          repository: amasat01/raptor
          path: raptor
          token: ${{ secrets.SIBLING_READ_TOKEN || github.token }}

      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/tsan-python
          key: tsan-python-${{ runner.os }}-${{ runner.arch }}-${{ env.TSAN_PY_VERSION }}-clang18-${{ hashFiles('eagle/tests/sanitize/build_tsan_python.sh') }}

      - name: TSan free-threaded CPython (cached)
        run: eagle/tests/sanitize/build_tsan_python.sh "$TSAN_PY_VERSION" "$RUNNER_TEMP/tsan-python"

      - run: |
          cmake -DAETHER_CPP_MODE=ON \
            -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}/__install" \
            -B aether/build -S aether
          cmake --install aether/build
          cmake -B eagle/__eagle_hdr -S eagle -DEAGLE_CPP_MODE=ON \
            -DCMAKE_PREFIX_PATH="${GITHUB_WORKSPACE}/__install" \
            -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}/__install"
          cmake --install eagle/__eagle_hdr

      - name: ft rows under ThreadSanitizer
        run: |
          cd eagle
          CMAKE_PREFIX_PATH="${GITHUB_WORKSPACE}/__install" RAPTOR_DIR="${GITHUB_WORKSPACE}/raptor" \
            tests/sanitize/tsan_ft.sh "$RUNNER_TEMP/tsan-python/bin/python${TSAN_PY_VERSION%.*}t"

  # test:python — builds eagle._core (plain C++) AND the libeagle_cuda.so backend
  # plugin (python/CMakeLists.txt's default EAGLE_PYTHON_CUDA_PLUGIN=BUILD needs nvcc)
  # against a provisioned compile-only CUDA toolchain — no GPU is present or required
  # to COMPILE. `gpu` is a registered pytest marker (python/pyproject.toml markers=),
  # so device-dependent tests are deselected with -m "not gpu"; `torch` and
  # `interop_matrix` are also registered but NOT deselected here (not asked for), so
  # some interop/torch rows may still fail without a GPU even after this filter.
  # This job was authored and YAML-validated offline; the CUDA package set/versions
  # below are UNVERIFIED — not run on a live runner.
  test-python:
    runs-on: ubuntu-latest
    env:
      CC: gcc-13
      CXX: g++-13
      # ccache: CMake reads the *_COMPILER_LAUNCHER variables, also under scikit-build-core
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
      CCACHE_COMPILERCHECK: content
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CMAKE_CUDA_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v7
        with:
          path: eagle

      - uses: actions/checkout@v7
        with:
          repository: amasat01/aether
          path: aether
          token: ${{ secrets.SIBLING_READ_TOKEN || github.token }}

      - uses: actions/checkout@v7
        with:
          repository: amasat01/raptor
          path: raptor
          token: ${{ secrets.SIBLING_READ_TOKEN || github.token }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            eagle/python/pyproject.toml
            raptor/pyproject.toml

      - run: sudo apt-get update && sudo apt-get install -y g++-13 ccache

      # compiled objects persist across runs; one cache per job and architecture
      - uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-v2-${{ runner.os }}-${{ runner.arch }}-test-python-${{ hashFiles('**/*.h', '**/*.hpp', '**/*.cpp', '**/*.cu', '**/*.cuh', '**/CMakeLists.txt') }}
          restore-keys: |
            ccache-v2-${{ runner.os }}-${{ runner.arch }}-test-python-
      - run: ccache -z

      # NVIDIA's apt repo for Ubuntu 24.04 (noble), x86_64.
      - name: Install compile-only CUDA 12.6 toolchain (nvcc; no driver/GPU)
        run: |
          curl -fsSL -o /tmp/cuda-keyring.deb \
            https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i /tmp/cuda-keyring.deb
          sudo apt-get update
          # cuda-nvcc-12-6 + cuda-cudart-dev-12-6 as suggested; cuda-driver-dev-12-6
          # added for the libcuda.so DRIVER STUB (stubs/, no actual driver) that
          # python/CMakeLists.txt's CUDA::cuda_driver link target needs.
          sudo apt-get install -y --no-install-recommends \
            cuda-nvcc-12-6 cuda-cudart-dev-12-6 cuda-driver-dev-12-6
          echo "/usr/local/cuda-12.6/bin" >> "$GITHUB_PATH"
          echo "CUDA_HOME=/usr/local/cuda-12.6" >> "$GITHUB_ENV"

      # deps: [OFF] — aether installed in its default CUDA-language mode
      # (needed because eagle._core is CUDA-language regardless of EAGLE_CPP_MODE).
      - run: |
          cmake -DAETHER_CPP_MODE=OFF -DCMAKE_CUDA_COMPILER="$(which nvcc)" \
            -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}/__install" \
            -B aether/build -S aether
          cmake --install aether/build

      # eagle's own header-only C++ config, installed next to aether so the
      # binding's find_package(eagle) resolves.
      - run: |
          cd eagle
          cmake -B __eagle_hdr -DCMAKE_CUDA_COMPILER="$(which nvcc)" \
            -DCMAKE_CUDA_ARCHITECTURES=70 \
            -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}/__install" .
          cmake --install __eagle_hdr

      # The binding build itself, with a single arch (70,
      # Volta) instead of the 4-way list since nothing here executes device
      # code.
      - run: |
          cd eagle
          python -m pip install --quiet --upgrade pip pytest
          # build deps preinstalled + --no-build-isolation: an isolated build compiles nanobind from a
          # random /tmp build env, so every compile line differs and ccache never hits;
          # --only-binary=:all: still builds this local project but never a dependency from
          # source, so no third-party sdist is ever built without its own isolated env
          python -m pip install --quiet "scikit-build-core>=0.10" "nanobind>=3.1,<4"
          export CMAKE_PREFIX_PATH="${GITHUB_WORKSPACE}/__install:${CMAKE_PREFIX_PATH}"
          export SKBUILD_CMAKE_ARGS="-DCMAKE_CUDA_COMPILER=$(which nvcc);-DCMAKE_CUDA_ARCHITECTURES=70"
          # the plugin carries the single arch built above, not the shipped list
          # (read by test_backend_wall where cuobjdump is present)
          export EAGLE_PLUGIN_EXPECTED_ARCHS=70/70
          pip install ../raptor   # the sibling checkout, so unreleased raptor changes are tested
          # editable, as in development: python/conftest.py puts this source tree first
          # on sys.path, and only the editable hook then resolves the compiled eagle._core
          pip install --no-build-isolation --only-binary=:all: -e ./python
          pytest python/tests -q -m "not gpu and not interop_matrix"
      - if: always()
        run: ccache -s

  # test-python-nodriver — the wheel where there is NO NVIDIA driver and NO CUDA
  # toolkit (a stock GitHub runner has neither). eagle._core is plain C++ and reaches
  # the GPU only through the separately loaded libeagle_cuda.so; this leg builds the
  # core-only wheel (EAGLE_PYTHON_CUDA_PLUGIN=OFF: no plugin, no nvcc), installs it
  # into a fresh venv, proves the installed package imports and refuses device work
  # with the typed eagle.BackendUnavailable, then runs a COPY of the suite outside
  # the repository against that installed package. Rows that certify the repository
  # itself (its C++ headers, sources, corpus) are marked repo_local and deselected
  # here only; gpu/torch rows need a device; the interop-matrix rows fail by design
  # unless deselected explicitly. All four are deselected in this leg.
  test-python-nodriver:
    runs-on: ubuntu-latest
    env:
      CC: gcc-13
      CXX: g++-13
      # ccache: CMake reads the *_COMPILER_LAUNCHER variables, also under scikit-build-core
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
      CCACHE_COMPILERCHECK: content
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CMAKE_CUDA_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v7
        with:
          path: eagle

      - uses: actions/checkout@v7
        with:
          repository: amasat01/aether
          path: aether
          token: ${{ secrets.SIBLING_READ_TOKEN || github.token }}

      - uses: actions/checkout@v7
        with:
          repository: amasat01/raptor
          path: raptor
          token: ${{ secrets.SIBLING_READ_TOKEN || github.token }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            eagle/python/pyproject.toml
            raptor/pyproject.toml

      - run: sudo apt-get update && sudo apt-get install -y g++-13 ccache

      # compiled objects persist across runs; one cache per job and architecture
      - uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-v2-${{ runner.os }}-${{ runner.arch }}-test-python-nodriver-${{ hashFiles('**/*.h', '**/*.hpp', '**/*.cpp', '**/*.cu', '**/*.cuh', '**/CMakeLists.txt') }}
          restore-keys: |
            ccache-v2-${{ runner.os }}-${{ runner.arch }}-test-python-nodriver-
      - run: ccache -z

      # The precondition this leg exists for: no driver library, no nvcc.
      - name: Assert the runner has no NVIDIA driver and no CUDA toolkit
        run: |
          if ldconfig -p | grep -q 'libcuda\.so\.1'; then echo "libcuda.so.1 present"; exit 1; fi
          if command -v nvcc; then echo "nvcc present"; exit 1; fi

      # Pure C++ aether + eagle headers (the core is compiled EAGLE_CPU_ONLY).
      - run: |
          cmake -DAETHER_CPP_MODE=ON \
            -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}/__install" \
            -B aether/build -S aether
          cmake --install aether/build
          cmake -B eagle/__eagle_hdr -S eagle -DEAGLE_CPP_MODE=ON \
            -DCMAKE_PREFIX_PATH="${GITHUB_WORKSPACE}/__install" \
            -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}/__install"
          cmake --install eagle/__eagle_hdr

      - name: Build the core-only wheel and install it into a fresh venv
        run: |
          python -m venv "${RUNNER_TEMP}/venv"
          . "${RUNNER_TEMP}/venv/bin/activate"
          pip install --quiet --upgrade pip pytest numpy build scikit-build-core nanobind
          pip install ./raptor   # the sibling checkout, so unreleased raptor changes are tested
          export CMAKE_PREFIX_PATH="${GITHUB_WORKSPACE}/__install"
          python -m build --wheel --no-isolation --outdir dist \
            -Ccmake.define.EAGLE_PYTHON_CUDA_PLUGIN=OFF \
            -Ccmake.define.EAGLE_PYTHON_MPI=OFF eagle/python
          if unzip -l dist/*.whl | grep -q libeagle_cuda; then echo "plugin in a core-only wheel"; exit 1; fi
          pip install dist/*.whl

      - name: The installed wheel imports and refuses device work, typed
        run: |
          . "${RUNNER_TEMP}/venv/bin/activate"
          cd "${RUNNER_TEMP}"
          python - <<'EOF'
          import eagle, eagle._core, eagle.exec
          assert "site-packages" in eagle._core.__file__, eagle._core.__file__
          assert eagle.exec.fold("sum", [1.0, 2.0]) == 3.0
          d = eagle._core.cuda_backend()
          assert not d["loaded"], d
          try:
              eagle._core.Stream()
              raise SystemExit("Stream() did not refuse")
          except eagle.BackendUnavailable as e:
              print("typed refusal:", e)
          maps = open("/proc/self/maps").read()
          assert "libcuda" not in maps and "libcudart" not in maps
          EOF

      - name: Host suite (a copy, outside the repository) against the installed wheel
        run: |
          . "${RUNNER_TEMP}/venv/bin/activate"
          mkdir -p "${RUNNER_TEMP}/suite"
          cp -r eagle/python/tests eagle/python/conftest.py "${RUNNER_TEMP}/suite/"
          cd "${RUNNER_TEMP}/suite"
          RAPTOR_ROOT="${GITHUB_WORKSPACE}/raptor" python -m pytest tests -q -p no:cacheprovider \
            -m "not gpu and not gpu2 and not torch and not interop_matrix and not repo_local"
          python -c 'import eagle; assert "site-packages" in eagle.__file__, eagle.__file__'
      - if: always()
        run: ccache -s

  # ft-stress: the free-threading rows (pytest -m ft) and the full suite under
  # -W error::RuntimeWarning on the free-threaded interpreters, built and set up
  # as test-python is (the same compile-only toolchain, editable install).
  ft-stress:
    runs-on: ubuntu-latest
    strategy:
      # both free-threaded interpreters report, even when one fails
      fail-fast: false
      matrix:
        python-version: ["3.13t", "3.14t"]
    env:
      CC: gcc-13
      CXX: g++-13
      # ccache: CMake reads the *_COMPILER_LAUNCHER variables, also under scikit-build-core
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
      CCACHE_COMPILERCHECK: content
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CMAKE_CUDA_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v7
        with:
          path: eagle

      - uses: actions/checkout@v7
        with:
          repository: amasat01/aether
          path: aether
          token: ${{ secrets.SIBLING_READ_TOKEN || github.token }}

      - uses: actions/checkout@v7
        with:
          repository: amasat01/raptor
          path: raptor
          token: ${{ secrets.SIBLING_READ_TOKEN || github.token }}

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            eagle/python/pyproject.toml
            raptor/pyproject.toml

      - run: sudo apt-get update && sudo apt-get install -y g++-13 ccache

      # compiled objects persist across runs; one cache per job and architecture
      - uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-v2-${{ runner.os }}-${{ runner.arch }}-ft-stress-${{ matrix.python-version }}-${{ hashFiles('**/*.h', '**/*.hpp', '**/*.cpp', '**/*.cu', '**/*.cuh', '**/CMakeLists.txt') }}
          restore-keys: |
            ccache-v2-${{ runner.os }}-${{ runner.arch }}-ft-stress-${{ matrix.python-version }}-
      - run: ccache -z

      # NVIDIA's apt repo for Ubuntu 24.04 (noble), x86_64.
      - name: Install compile-only CUDA 12.6 toolchain (nvcc; no driver/GPU)
        run: |
          curl -fsSL -o /tmp/cuda-keyring.deb \
            https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i /tmp/cuda-keyring.deb
          sudo apt-get update
          # cuda-nvcc-12-6 + cuda-cudart-dev-12-6 as suggested; cuda-driver-dev-12-6
          # added for the libcuda.so DRIVER STUB (stubs/, no actual driver) that
          # python/CMakeLists.txt's CUDA::cuda_driver link target needs.
          sudo apt-get install -y --no-install-recommends \
            cuda-nvcc-12-6 cuda-cudart-dev-12-6 cuda-driver-dev-12-6
          echo "/usr/local/cuda-12.6/bin" >> "$GITHUB_PATH"
          echo "CUDA_HOME=/usr/local/cuda-12.6" >> "$GITHUB_ENV"

      # deps: [OFF] — aether installed in its default CUDA-language mode
      # (needed because eagle._core is CUDA-language regardless of EAGLE_CPP_MODE).
      - run: |
          cmake -DAETHER_CPP_MODE=OFF -DCMAKE_CUDA_COMPILER="$(which nvcc)" \
            -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}/__install" \
            -B aether/build -S aether
          cmake --install aether/build

      # eagle's own header-only C++ config, installed next to aether so the
      # binding's find_package(eagle) resolves.
      - run: |
          cd eagle
          cmake -B __eagle_hdr -DCMAKE_CUDA_COMPILER="$(which nvcc)" \
            -DCMAKE_CUDA_ARCHITECTURES=70 \
            -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}/__install" .
          cmake --install __eagle_hdr

      # The binding build itself, with a single arch (70,
      # Volta) instead of the 4-way list since nothing here executes device
      # code.
      - run: |
          cd eagle
          # newest NumPy/SciPy ship no cp313t wheel: prefer a wheel over an sdist build
          python -m pip install --quiet --prefer-binary --upgrade pip pytest
          # build deps preinstalled + --no-build-isolation: an isolated build compiles nanobind from a
          # random /tmp build env, so every compile line differs and ccache never hits;
          # --only-binary=:all: still builds this local project but never a dependency from
          # source, so no third-party sdist is ever built without its own isolated env
          python -m pip install --quiet --prefer-binary "scikit-build-core>=0.10" "nanobind>=3.1,<4"
          export CMAKE_PREFIX_PATH="${GITHUB_WORKSPACE}/__install:${CMAKE_PREFIX_PATH}"
          export SKBUILD_CMAKE_ARGS="-DCMAKE_CUDA_COMPILER=$(which nvcc);-DCMAKE_CUDA_ARCHITECTURES=70"
          # the plugin carries the single arch built above, not the shipped list
          # (read by test_backend_wall where cuobjdump is present)
          export EAGLE_PLUGIN_EXPECTED_ARCHS=70/70
          pip install --prefer-binary ../raptor   # the sibling checkout, so unreleased raptor changes are tested
          # editable, as in development: python/conftest.py puts this source tree first
          # on sys.path, and only the editable hook then resolves the compiled eagle._core
          pip install --no-build-isolation --only-binary=:all: -e ./python

      # An ft leg is vacuous on a GIL interpreter (every ft row skips) and the
      # harness refuses a forced GIL-off (-X gil=0 / PYTHON_GIL): assert the
      # interpreter is free-threaded with the GIL off by default, no override.
      - name: Interpreter is free-threaded, GIL off, no override
        run: |
          [ -z "${PYTHON_GIL:-}" ] || { echo "PYTHON_GIL is set"; exit 1; }
          python -c "import sys; assert sys._is_gil_enabled() is False, 'GIL is enabled'; print(sys.version)"

      # ft rows first: zero collected rows fails the leg (never a green no-op),
      # then the full suite. -W error::RuntimeWarning turns the interpreter's
      # "GIL re-enabled by an extension" warning into a failure.
      - name: ft rows (collected count must be > 0), then the full suite
        run: |
          set -euo pipefail
          cd eagle
          export EAGLE_PLUGIN_EXPECTED_ARCHS=70/70
          N="$(python -m pytest python/tests -m ft --collect-only -q -p no:cacheprovider | grep -c '::' || true)"
          echo "ft rows collected: $N"
          [ "$N" -gt 0 ] || { echo "ft selection collected zero tests"; exit 1; }
          python -m pytest python/tests -m ft -q -rs -p no:cacheprovider -W error::RuntimeWarning
          python -m pytest python/tests -q -p no:cacheprovider -W error::RuntimeWarning -m "not gpu and not interop_matrix"
      - if: always()
        run: ccache -s

