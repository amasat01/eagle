#
# CI: the CPP_MODE arm (deps -> build:cpp -> test:cpp) plus a provisioned-toolchain build of the
# eagle._core python binding (test:python), and the core-only wheel on a
# runner with no NVIDIA driver and no CUDA toolkit (test-python-nodriver). The
# CUDA C++ arm (test:cuda) still needs a real GPU to RUN on and is not wired here.

name: CI

# Pull requests only: main receives the tested tree, nothing re-runs there.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    # The release label, the diff, the PR body and the tag it would create agree (tools/release_gate.sh). Skipped on other PRs.
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - env:
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: make release-gate BASE_SHA="${{ github.event.pull_request.base.sha }}" HEAD_SHA="${{ github.event.pull_request.head.sha }}"
  docs-fresh:
    # Freshness check, never a commit: the generator re-renders the pages and fails on any difference.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # companion site (amasat01.github.io): the ref pinned in .github/companions, else a same-named branch, else main
      - uses: ./.github/actions/companion
        with:
          repo: amasat01.github.io
          path: site
          token: ${{ secrets.SIBLING_READ_TOKEN || github.token }}
          pins: .github/companions
      - run: python -m pip install --quiet ./site
      - name: documented numbers and the capability map match the committed cards
        run: python -m raptor_docs.fresh --check --site site
      - name: ruff (repo config), manifesto copy
        run: make gate-lint
      # the public-name check is raptor's (raptor.conformance.public_names): this branch's raptor, else main
      - uses: ./.github/actions/companion
        with:
          repo: raptor
          path: raptor
          token: ${{ secrets.SIBLING_READ_TOKEN || github.token }}
          pins: .github/companions
      - name: public-name coverage
        run: make gate-names RAPTOR_SRC=raptor COVERAGE_BASE="${{ github.event.pull_request.base.sha }}"
  test-cpp:
    needs: docs-fresh
    runs-on: ubuntu-24.04
    env:
      CC: gcc-13
      CXX: g++-13
      # ccache: CMake reads the *_COMPILER_LAUNCHER variables, also under scikit-build-core
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
      CCACHE_COMPILERCHECK: content
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CMAKE_CUDA_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v7
        with:
          path: eagle
          fetch-depth: 0
      - uses: ./eagle/.github/actions/tag-version
        with:
          path: eagle

      # aether as a sibling checkout (amasat01/aether, at this branch name if it has one, else main).
      # companion aether: the ref pinned in .github/companions, else a same-named branch, else main
      - uses: ./eagle/.github/actions/companion
        with:
          repo: aether
          path: aether
          token: ${{ secrets.SIBLING_READ_TOKEN || github.token }}
          pins: eagle/.github/companions

      - run: sudo apt-get update && sudo apt-get install -y g++-13 ccache clang-18 libomp-18-dev

      # compiled objects persist across runs; one cache per job and architecture
      - uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-v2-${{ runner.os }}-${{ runner.arch }}-test-cpp-${{ hashFiles('**/*.h', '**/*.hpp', '**/*.cpp', '**/*.cu', '**/*.cuh', '**/CMakeLists.txt') }}
          restore-keys: |
            ccache-v2-${{ runner.os }}-${{ runner.arch }}-test-cpp-
      - run: ccache -z

      # the host C++ gate: aether's headers installed, eagle built with -Werror, the manifest-backed integrity gate,
      # and every header on its own with both compilers (the commands live in the Makefile)
      - run: make gate-cpp AETHER_SRC="${GITHUB_WORKSPACE}/aether" CLANGXX=clang++-18
        working-directory: eagle
      - if: always()
        run: ccache -s

  # Sanitizer leg (host only): the CPP_MODE suite built with -fsanitize=address,undefined and run
  # through the manifest gate. Three checks keep it from going vacuously green: the runtime is
  # linked, the committed canary (tests/sanitize/canary.cpp) trips every mode, and the suite
  # count equals the manifest. CUDA-side coverage is the local `sanitize-gate`
  # (tests/sanitize/README.md).
  sanitize-cpp:
    needs: docs-fresh
    runs-on: ubuntu-24.04
    env:
      CC: gcc-13
      CXX: g++-13
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
      CCACHE_COMPILERCHECK: content
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v7
        with:
          path: eagle
          fetch-depth: 0
      - uses: ./eagle/.github/actions/tag-version
        with:
          path: eagle

      # companion aether: the ref pinned in .github/companions, else a same-named branch, else main
      - uses: ./eagle/.github/actions/companion
        with:
          repo: aether
          path: aether
          token: ${{ secrets.SIBLING_READ_TOKEN || github.token }}
          pins: eagle/.github/companions

      # A pass is remembered under a digest of every input this job reads: the trees, this workflow (which names the
      # toolchain pins) and the runner image. On a hit the job succeeds without building.
      - id: memo
        run: |
          digest=$(eagle/.github/ci_digest.sh --tree eagle --skip docs/ --skip .github/ --tree aether --skip docs/ --skip .github/ --tag eagle \
            --file eagle/.github/workflows/ci.yml --str "${ImageVersion:-}" --str "$(g++-13 --version 2>/dev/null | head -1 || true)") || exit 1
          [ -n "$digest" ] || { echo "::error::empty digest"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - id: pass
        uses: actions/cache/restore@v6
        with:
          path: ci-pass
          key: ci-pass-v2-sanitize-cpp-${{ steps.memo.outputs.digest }}
          lookup-only: true
      - id: plan
        env:
          HIT: ${{ steps.pass.outputs.cache-hit }}
          DIGEST: ${{ steps.memo.outputs.digest }}
        run: |
          if [ "$HIT" = true ]; then
            echo "sanitize-cpp: passed earlier on digest $DIGEST" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo run=true >> "$GITHUB_OUTPUT"
          fi

      - run: sudo apt-get update && sudo apt-get install -y g++-13 ccache
        if: steps.plan.outputs.run == 'true'

      - uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-v2-${{ runner.os }}-${{ runner.arch }}-sanitize-cpp-${{ hashFiles('**/*.h', '**/*.hpp', '**/*.cpp', '**/*.cu', '**/*.cuh', '**/CMakeLists.txt') }}
          restore-keys: |
            ccache-v2-${{ runner.os }}-${{ runner.arch }}-sanitize-cpp-
        if: steps.plan.outputs.run == 'true'
      - run: ccache -z
        if: steps.plan.outputs.run == 'true'

      # the build, the three non-vacuity checks and the manifest gate, from the Makefile
      - run: make sanitize-cpp AETHER_SRC="${GITHUB_WORKSPACE}/aether"
        working-directory: eagle
        if: steps.plan.outputs.run == 'true'
      - if: always() && steps.plan.outputs.run == 'true'
        run: ccache -s
      - if: steps.plan.outputs.run == 'true'
        run: mkdir -p ci-pass && touch ci-pass/sanitize-cpp
      - if: hashFiles('ci-pass/*') != ''
        uses: actions/cache/save@v6
        with:
          path: ci-pass
          key: ci-pass-v2-sanitize-cpp-${{ steps.memo.outputs.digest }}

  # tsan-ft — eagle._core under ThreadSanitizer on a free-threaded CPython built
  # with --with-thread-sanitizer (cached per version + compiler), running the ft
  # rows. Green = the canary race is reported without our suppressions (the
  # detector reaches _core) AND the ft rows give zero reports with them. See
  # tests/sanitize/tsan_ft.sh and tests/sanitize/tsan.supp.
  tsan-ft:
    needs: docs-fresh
    runs-on: ubuntu-24.04
    env:
      CC: clang-18
      CXX: clang++-18
      TSAN_PY_VERSION: "3.14.8"
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
      CCACHE_COMPILERCHECK: content
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v7
        with:
          path: eagle
          fetch-depth: 0
      - uses: ./eagle/.github/actions/tag-version
        with:
          path: eagle

      # companion aether: the ref pinned in .github/companions, else a same-named branch, else main
      - uses: ./eagle/.github/actions/companion
        with:
          repo: aether
          path: aether
          token: ${{ secrets.SIBLING_READ_TOKEN || github.token }}
          pins: eagle/.github/companions

      # companion raptor: the ref pinned in .github/companions, else a same-named branch, else main
      - uses: ./eagle/.github/actions/companion
        with:
          repo: raptor
          path: raptor
          token: ${{ secrets.SIBLING_READ_TOKEN || github.token }}
          pins: eagle/.github/companions

      # A pass is remembered under a digest of every input this job reads: the trees, this workflow (which names the
      # toolchain pins) and the runner image. On a hit the job succeeds without building.
      - id: memo
        run: |
          digest=$(eagle/.github/ci_digest.sh --tree eagle --skip docs/ --skip .github/ --tree aether --skip docs/ --skip .github/ --tree raptor --skip docs/ --skip .github/ --tag eagle \
            --file eagle/.github/workflows/ci.yml --str "${ImageVersion:-}" --str "$TSAN_PY_VERSION") || exit 1
          [ -n "$digest" ] || { echo "::error::empty digest"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - id: pass
        uses: actions/cache/restore@v6
        with:
          path: ci-pass
          key: ci-pass-v2-tsan-ft-${{ steps.memo.outputs.digest }}
          lookup-only: true
      - id: plan
        env:
          HIT: ${{ steps.pass.outputs.cache-hit }}
          DIGEST: ${{ steps.memo.outputs.digest }}
        run: |
          if [ "$HIT" = true ]; then
            echo "tsan-ft: passed earlier on digest $DIGEST" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo run=true >> "$GITHUB_OUTPUT"
          fi

      # compiled objects persist across runs
      - uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-v2-${{ runner.os }}-${{ runner.arch }}-tsan-ft-${{ hashFiles('**/*.h', '**/*.hpp', '**/*.cpp', '**/*.cu', '**/*.cuh', '**/CMakeLists.txt') }}
          restore-keys: |
            ccache-v2-${{ runner.os }}-${{ runner.arch }}-tsan-ft-
        if: steps.plan.outputs.run == 'true'

      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/tsan-python
          key: tsan-python-${{ runner.os }}-${{ runner.arch }}-${{ env.TSAN_PY_VERSION }}-clang18-${{ hashFiles('eagle/tests/sanitize/build_tsan_python.sh') }}
        if: steps.plan.outputs.run == 'true'

      # clang's OpenMP runtime (eagle._core needs OpenMP; gcc's libgomp does not pair with clang)
      - run: sudo apt-get update && sudo apt-get install -y libomp-18-dev ccache
        if: steps.plan.outputs.run == 'true'

      - run: ccache -z
        if: steps.plan.outputs.run == 'true'
      # the TSan CPython (cached under $RUNNER_TEMP/tsan-python), the header installs and the ft rows, from the Makefile
      - name: ft rows under ThreadSanitizer
        run: make tsan-ft AETHER_SRC="${GITHUB_WORKSPACE}/aether" RAPTOR_SRC="${GITHUB_WORKSPACE}/raptor" TSAN_PY_VERSION="$TSAN_PY_VERSION" GATE_DIR="$RUNNER_TEMP"
        working-directory: eagle
        if: steps.plan.outputs.run == 'true'
      - if: always() && steps.plan.outputs.run == 'true'
        run: ccache -s
      - if: steps.plan.outputs.run == 'true'
        run: mkdir -p ci-pass && touch ci-pass/tsan-ft
      - if: hashFiles('ci-pass/*') != ''
        uses: actions/cache/save@v6
        with:
          path: ci-pass
          key: ci-pass-v2-tsan-ft-${{ steps.memo.outputs.digest }}

  # test:python — builds eagle._core (plain C++) AND the libeagle_cuda.so backend
  # plugin (python/CMakeLists.txt's default EAGLE_PYTHON_CUDA_PLUGIN=BUILD needs nvcc)
  # against a provisioned compile-only CUDA toolchain — no GPU is present or required
  # to COMPILE. `gpu` is a registered pytest marker (python/pyproject.toml markers=),
  # so device-dependent tests are deselected with -m "not gpu"; `torch` and
  # `interop_matrix` are also registered but NOT deselected here (not asked for), so
  # some interop/torch rows may still fail without a GPU even after this filter.
  # This job was authored and YAML-validated offline; the CUDA package set/versions
  # below are UNVERIFIED — not run on a live runner.
  test-python:
    needs: docs-fresh
    runs-on: ubuntu-24.04
    permissions:
      contents: read   # the read-only token the card download uses
    env:
      CC: gcc-13
      CXX: g++-13
      # ccache: CMake reads the *_COMPILER_LAUNCHER variables, also under scikit-build-core
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
      CCACHE_COMPILERCHECK: content
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CMAKE_CUDA_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v7
        with:
          path: eagle
          fetch-depth: 0
      - uses: ./eagle/.github/actions/tag-version
        with:
          path: eagle

      # companion aether: the ref pinned in .github/companions, else a same-named branch, else main
      - uses: ./eagle/.github/actions/companion
        with:
          repo: aether
          path: aether
          token: ${{ secrets.SIBLING_READ_TOKEN || github.token }}
          pins: eagle/.github/companions

      # companion raptor: the ref pinned in .github/companions, else a same-named branch, else main
      - uses: ./eagle/.github/actions/companion
        with:
          repo: raptor
          path: raptor
          token: ${{ secrets.SIBLING_READ_TOKEN || github.token }}
          pins: eagle/.github/companions

      # companion site: the shared docs package (raptor_docs) the docs-include and card-coverage tests import
      - uses: ./eagle/.github/actions/companion
        with:
          repo: amasat01.github.io
          path: site
          token: ${{ secrets.SIBLING_READ_TOKEN || github.token }}
          pins: eagle/.github/companions

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            eagle/python/pyproject.toml
            raptor/pyproject.toml

      - run: sudo apt-get update && sudo apt-get install -y g++-13 ccache

      # compiled objects persist across runs; one cache per job and architecture
      - uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-v2-${{ runner.os }}-${{ runner.arch }}-test-python-${{ hashFiles('**/*.h', '**/*.hpp', '**/*.cpp', '**/*.cu', '**/*.cuh', '**/CMakeLists.txt') }}
          restore-keys: |
            ccache-v2-${{ runner.os }}-${{ runner.arch }}-test-python-
      - run: ccache -z

      # compile-only CUDA 12.9 toolchain (nvcc, headers, driver stub, CCCL) from the pinned redist archives; no driver, no GPU
      - uses: ./eagle/.github/actions/cuda

      # the full card rows are a release asset; with EAGLE_CARD_RAW_DIR set, a missing or altered file fails
      - name: download the full performance cards
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir "${RUNNER_TEMP}/cards"
          gh release download perf-cards-raw --repo "${GITHUB_REPOSITORY}" -p cards.tar.gz -O - | tar -xz -C "${RUNNER_TEMP}/cards"
          echo "EAGLE_CARD_RAW_DIR=${RUNNER_TEMP}/cards" >> "${GITHUB_ENV}"

      # The binding build with a single arch (nothing here executes device code) and the suite, from the Makefile:
      # aether and eagle headers installed, siblings from their checkouts, `pytest -m "not gpu and not interop_matrix"`
      - run: |
          make gate-py AETHER_SRC="${GITHUB_WORKSPACE}/aether" RAPTOR_SRC="${GITHUB_WORKSPACE}/raptor" \
            SITE_SRC="${GITHUB_WORKSPACE}/site" CUDACXX="$(which nvcc)"
        working-directory: eagle
      - if: always()
        run: ccache -s

  # test-python-nodriver — the wheel where there is NO NVIDIA driver and NO CUDA
  # toolkit (a stock GitHub runner has neither). eagle._core is plain C++ and reaches
  # the GPU only through the separately loaded libeagle_cuda.so; this leg builds the
  # core-only wheel (EAGLE_PYTHON_CUDA_PLUGIN=OFF: no plugin, no nvcc), installs it
  # into a fresh venv, proves the installed package imports and refuses device work
  # with the typed eagle.BackendUnavailable, then runs a COPY of the suite outside
  # the repository against that installed package. Rows that certify the repository
  # itself (its C++ headers, sources, corpus) are marked repo_local and deselected
  # here only; gpu/torch rows need a device; the interop-matrix rows fail by design
  # unless deselected explicitly. All four are deselected in this leg.
  test-python-nodriver:
    needs: docs-fresh
    runs-on: ubuntu-24.04
    env:
      CC: gcc-13
      CXX: g++-13
      # ccache: CMake reads the *_COMPILER_LAUNCHER variables, also under scikit-build-core
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
      CCACHE_COMPILERCHECK: content
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CMAKE_CUDA_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v7
        with:
          path: eagle
          fetch-depth: 0
      - uses: ./eagle/.github/actions/tag-version
        with:
          path: eagle

      # companion aether: the ref pinned in .github/companions, else a same-named branch, else main
      - uses: ./eagle/.github/actions/companion
        with:
          repo: aether
          path: aether
          token: ${{ secrets.SIBLING_READ_TOKEN || github.token }}
          pins: eagle/.github/companions

      # companion raptor: the ref pinned in .github/companions, else a same-named branch, else main
      - uses: ./eagle/.github/actions/companion
        with:
          repo: raptor
          path: raptor
          token: ${{ secrets.SIBLING_READ_TOKEN || github.token }}
          pins: eagle/.github/companions

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            eagle/python/pyproject.toml
            raptor/pyproject.toml

      - run: sudo apt-get update && sudo apt-get install -y g++-13 ccache

      # compiled objects persist across runs; one cache per job and architecture
      - uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-v2-${{ runner.os }}-${{ runner.arch }}-test-python-nodriver-${{ hashFiles('**/*.h', '**/*.hpp', '**/*.cpp', '**/*.cu', '**/*.cuh', '**/CMakeLists.txt') }}
          restore-keys: |
            ccache-v2-${{ runner.os }}-${{ runner.arch }}-test-python-nodriver-
      - run: ccache -z

      # The precondition this leg exists for: no driver library, no nvcc.
      # the no-driver assertions, the core-only wheel in a fresh venv, the import checks and the suite copy, from the Makefile
      - run: make nodriver AETHER_SRC="${GITHUB_WORKSPACE}/aether" RAPTOR_SRC="${GITHUB_WORKSPACE}/raptor"
        working-directory: eagle
      - if: always()
        run: ccache -s

  # ft-stress: the free-threading rows (pytest -m ft) and the full suite under
  # -W error::RuntimeWarning on the free-threaded interpreters, built and set up
  # as test-python is (the same compile-only toolchain, editable install).
  ft-stress:
    needs: docs-fresh
    runs-on: ubuntu-24.04
    strategy:
      # both free-threaded interpreters report, even when one fails
      fail-fast: false
      matrix:
        python-version: ["3.13t", "3.14t"]
    env:
      CC: gcc-13
      CXX: g++-13
      # ccache: CMake reads the *_COMPILER_LAUNCHER variables, also under scikit-build-core
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
      CCACHE_COMPILERCHECK: content
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CMAKE_CUDA_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v7
        with:
          path: eagle
          fetch-depth: 0
      - uses: ./eagle/.github/actions/tag-version
        with:
          path: eagle

      # companion aether: the ref pinned in .github/companions, else a same-named branch, else main
      - uses: ./eagle/.github/actions/companion
        with:
          repo: aether
          path: aether
          token: ${{ secrets.SIBLING_READ_TOKEN || github.token }}
          pins: eagle/.github/companions

      # companion raptor: the ref pinned in .github/companions, else a same-named branch, else main
      - uses: ./eagle/.github/actions/companion
        with:
          repo: raptor
          path: raptor
          token: ${{ secrets.SIBLING_READ_TOKEN || github.token }}
          pins: eagle/.github/companions

      # companion site: the shared docs package (raptor_docs) the docs tests import
      - uses: ./eagle/.github/actions/companion
        with:
          repo: amasat01.github.io
          path: site
          token: ${{ secrets.SIBLING_READ_TOKEN || github.token }}
          pins: eagle/.github/companions

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            eagle/python/pyproject.toml
            raptor/pyproject.toml

      - run: sudo apt-get update && sudo apt-get install -y g++-13 ccache

      # compiled objects persist across runs; one cache per job and architecture
      - uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-v2-${{ runner.os }}-${{ runner.arch }}-ft-stress-${{ matrix.python-version }}-${{ hashFiles('**/*.h', '**/*.hpp', '**/*.cpp', '**/*.cu', '**/*.cuh', '**/CMakeLists.txt') }}
          restore-keys: |
            ccache-v2-${{ runner.os }}-${{ runner.arch }}-ft-stress-${{ matrix.python-version }}-
      - run: ccache -z

      # compile-only CUDA 12.9 toolchain (nvcc, headers, driver stub, CCCL) from the pinned redist archives; no driver, no GPU
      - uses: ./eagle/.github/actions/cuda

      # deps: [OFF] — aether installed in its default CUDA-language mode
      # (needed because eagle._core is CUDA-language regardless of EAGLE_CPP_MODE).
      # the binding build, the free-threaded checks, torch/jax/warp, the ft rows and the full suite, from the Makefile
      - run: |
          make ft-stress PYTHON=python AETHER_SRC="${GITHUB_WORKSPACE}/aether" RAPTOR_SRC="${GITHUB_WORKSPACE}/raptor" \
            SITE_SRC="${GITHUB_WORKSPACE}/site" CUDACXX="$(which nvcc)"
        working-directory: eagle
      - if: always()
        run: ccache -s


  # The source distribution as a user without a matching wheel gets it: build the
  # sdist exactly as release.yml does, then pip install it into a clean venv with
  # nothing else provided (no CMAKE_PREFIX_PATH, no eagle_DIR, no installed
  # headers) and use it. On x86_64 and on aarch64; compiler warnings in eagle's
  # own sources are errors here.
  sdist-install:
    needs: docs-fresh
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    env:
      CC: gcc-13
      CXX: g++-13
    steps:
      - uses: actions/checkout@v7
        with:
          path: eagle
          fetch-depth: 0
      - uses: ./eagle/.github/actions/tag-version
        with:
          path: eagle

      # companion aether: the ref pinned in .github/companions, else a same-named branch, else main
      - uses: ./eagle/.github/actions/companion
        with:
          repo: aether
          path: aether
          token: ${{ secrets.SIBLING_READ_TOKEN || github.token }}
          pins: eagle/.github/companions

      # companion raptor: used only while its version is not on PyPI yet (a release in flight)
      - uses: ./eagle/.github/actions/companion
        with:
          repo: raptor
          path: raptor
          token: ${{ secrets.SIBLING_READ_TOKEN || github.token }}
          pins: eagle/.github/companions

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            eagle/python/pyproject.toml
            raptor/pyproject.toml
            aether/dsc/pyproject.toml

      - run: sudo apt-get update && sudo apt-get install -y g++-13

      - name: make sdist-install (the sdist as release.yml builds it, installed warnings-as-errors into a clean venv)
        run: make sdist-install AETHER_SRC="${GITHUB_WORKSPACE}/aether" RAPTOR_SRC="${GITHUB_WORKSPACE}/raptor"
        working-directory: eagle
