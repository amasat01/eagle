#
# Runs eagle's GPU interop certification rows (including JAX) and EVERY docs notebook (site, eagle, hawk;
# found by glob, nothing listed by hand) on a free Kaggle T4, for CUDA 12 and CUDA 13. GitHub's hosted
# runners have no GPU, so this is where the `interop_matrix` rows and the GPU-only notebooks run on real
# hardware. Each CUDA leg pushes two private Kaggle kernels (.github/kaggle/kernel.py): `tests` and
# `notebooks`, separate so neither shares the other's time limit; at most two run at once. Each waits for
# its kernel and fails if any test or notebook failed; the job summary lists PASS / FAIL / SKIP and the
# seconds of every notebook. A CUDA 13 run
# on a machine whose driver is older than 580 is reported as a warning and a green job.
#
# Started by hand (workflow_dispatch) only, to test the published wheels (source pypi) or a git ref (source
# git). Pull requests run the same kernels with their own wheel from release.yml (job kaggle-leg, one per leg).
# Both use the `kaggle` environment (required reviewer) and the secret KAGGLE_API_TOKEN.

name: Kaggle GPU

on:
  workflow_dispatch:
    inputs:
      eagle_ref:
        description: eagle ref (tests, and the build when source is git); empty = the branch you run from
        default: ""
      hawk_ref:
        description: hawk ref (used when source is git)
        default: main
      raptor_ref:
        description: raptor ref (RAPTOR_ROOT, and the build when source is git)
        default: main
      aether_ref:
        description: aether ref (used when source is git)
        default: main
      site_ref:
        description: landing-site ref (its docs tooling and notebooks, notebooks mode)
        default: main
      source:
        description: Where the packages come from
        type: choice
        options: [pypi, git]
        default: pypi
      pre:
        description: Allow pre-release packages (pip --pre)
        type: boolean
        default: false
      version:
        description: Exact raptor-eagle version (pypi only, optional; hawk takes its newest)
        default: ""

permissions:
  contents: read

jobs:
  kaggle-gpu:
    runs-on: ubuntu-24.04
    environment: kaggle
    timeout-minutes: 210  # the notebooks kernel may run 180 minutes (drive.py LIMITS)
    strategy:
      fail-fast: false
      max-parallel: 2  # at most two Kaggle kernels at once
      matrix:
        include:
          - {cuda: 12, mode: tests}
          - {cuda: 13, mode: tests}
          - {cuda: 12, mode: notebooks}
          - {cuda: 13, mode: notebooks}
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet kaggle
      - name: Run the kernel on Kaggle
        env:
          INPUT_EAGLE_REF: ${{ inputs.eagle_ref || github.ref_name }}
          INPUT_HAWK_REF: ${{ inputs.hawk_ref || 'main' }}
          INPUT_RAPTOR_REF: ${{ inputs.raptor_ref || 'main' }}
          INPUT_AETHER_REF: ${{ inputs.aether_ref || 'main' }}
          INPUT_SITE_REF: ${{ inputs.site_ref || 'main' }}
          INPUT_SOURCE: ${{ inputs.source }}
          INPUT_PRE: ${{ inputs.pre && 'true' || 'false' }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          args=(--cuda "${{ matrix.cuda }}" --mode "${{ matrix.mode }}" --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
                --eagle-ref "$INPUT_EAGLE_REF" --hawk-ref "$INPUT_HAWK_REF"
                --raptor-ref "$INPUT_RAPTOR_REF" --aether-ref "$INPUT_AETHER_REF" --site-ref "$INPUT_SITE_REF"
                --source "$INPUT_SOURCE" --out kaggle-out)
          if [ "$INPUT_PRE" = true ]; then args+=(--pre); fi
          if [ -n "$INPUT_VERSION" ]; then args+=(--version "$INPUT_VERSION"); fi
          python .github/kaggle/drive.py "${args[@]}"
      - name: Keep the kernel log and result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kaggle-gpu-cuda${{ matrix.cuda }}-${{ matrix.mode }}
          path: kaggle-out
          if-no-files-found: warn
