[build-system]
requires = [
    "scikit-build-core>=0.10",
    "setuptools-scm>=8",
    # nanobind 3 needs Python 3.10+; 3.9 (no free-threaded build) uses nanobind 2
    "nanobind>=3.1,<4; python_version>='3.10'",
    "nanobind>=2.2,<3; python_version<'3.10'",
]
build-backend = "_build_backend"
backend-path = ["."]

[project]
name = "raptor-eagle"
dynamic = ["version"]
description = "EAGLE — the Python face of the launch engine for compiled CUDA kernels"
# A copy of the repository README, made by _build_backend.py (git-ignored).
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
# Python versions match the cibuildwheel matrix release.yml actually builds
# and the test-wheel job actually runs (cp39-cp315 plus the free-threaded cp313t/cp314t/cp315t; manylinux_2_28 x86_64 and aarch64, macOS arm64) —
# never wider than what a real wheel ships.
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Environment :: GPU :: NVIDIA CUDA",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
]
# raptor: the schema constants eagle.roles re-exports (SCHEMA_VERSION and the
# neural-block vocabulary) are single-sourced there now. raptor-core is on PyPI.
# DIST names carry the `raptor-` family
# namespace, IMPORT names stay flat (`import eagle`, `import raptor`). Both bare
# `eagle` and bare `raptor` are taken on PyPI by unrelated packages.
# >=0.3.1 carries the JAX interop rows eagle declares. 0.3 shipped the free-threading conformance harness
# (`raptor.conformance.freethreading`) eagle's free-threading tests import; it also keeps
# `raptor.schema.blocks.validate_neural_block_descriptor` (first shipped in 0.2.0), which
# `eagle.sidecar` imports. The constraint is expressed where a resolver can act on it,
# never as a runtime surprise.
# aether-dsc: the `aether` arrays eagle allocates its planes with (CPU and GPU, no extra needed).
dependencies = ["raptor-core>=0.7.0,<0.8", "aether-dsc>=0.7.2,<0.8"]

# The "raptor.pattern_loaders" entry-point declaration for
# "neural_block" moved to a separate package — eagle.neural was extracted there
# in full, so eagle itself has no pattern-loader entry point left to declare.

[project.optional-dependencies]
# numpy: the host-array bridge (eagle.frameworks.numpy) and the tests; eagle itself imports none.
numpy = ["numpy>=1.26"]
# cupy is env-provided on the deployment boxes (pinned against the local CUDA
# toolkit); the extras are a convenience for a fresh environment. ``cuda`` is an
# alias of ``cuda12`` so existing install lines keep working.
# CuPy compiles its kernels at run time and needs the CUDA runtime headers and NVRTC:
# cuda-toolkit[cudart,nvrtc] brings exactly those as pip wheels (no system toolkit),
# without the math libraries CuPy's own [ctk] extra adds (cuBLAS, cuFFT, ...).
# CuPy 14 dropped Python 3.9 (its last 3.9 release is 13.6), so the extras pick by
# marker. CuPy 14 ships no cp313t wheel: on free-threaded 3.13 the GPU extras do not
# resolve and eagle runs on the CPU route only. The same holds on aarch64, where CuPy's wheels
# also stop at 3.14 (no 3.15 or 3.15t build either).
cuda12 = [
    "cupy-cuda12x>=14; python_version>='3.10'",
    "cupy-cuda12x>=13.6,<14; python_version<'3.10'",
    "cuda-toolkit[cudart,nvrtc]==12.*",
]
cuda13 = [
    "cupy-cuda13x>=14; python_version>='3.10'",
    "cupy-cuda13x>=13.6,<14; python_version<'3.10'",
    "cuda-toolkit[cudart,nvrtc]==13.*",
]
cuda = [
    "cupy-cuda12x>=14; python_version>='3.10'",
    "cupy-cuda12x>=13.6,<14; python_version<'3.10'",
    "cuda-toolkit[cudart,nvrtc]==12.*",
]
# eagle.frameworks.torch: the torch.autograd bridge. torch is imported only by
# that submodule, so plain `import eagle` never needs it. The bridges compile
# kernels with hawk; 0.5.1 is the first to derive nested derivatives.
torch = ["torch>=2.2", "raptor-hawk>=0.7.2,<0.8"]
# eagle's JAX interop and eagle.frameworks.jax (see docs: interop contract).
# JAX publishes wheels for Python 3.12 and newer, so this extra resolves there
# and nowhere else; for GPU arrays install JAX's own CUDA extra (jax[cuda12] or
# jax[cuda13]). The floor is the jaxlib whose XLA FFI headers libeagle_xla.so
# vendors (an older runtime with newer headers is the unsupported direction).
jax = ["jax>=0.11.2", "raptor-hawk>=0.7.2,<0.8"]
# What the test suite imports (the gate installs this, with ci/constraints.txt): pytest and numpy. Rows that need
# torch, jax, warp or cupy sit behind their own extras and markers (interop_matrix, gpu, torch).
test = ["pytest>=8", "pytest-xdist", "numpy", "ruff"]
# What the docs build and notebook check import: the Sphinx stack docs/requirements.txt pins, and the notebooks' libraries.
# raptor-docs (the shared tooling) is a checkout of the landing site, installed beside this (see the Makefile's SITE_SRC).
docs = [
    "Sphinx==8.2.3", "myst-nb==1.4.0", "sphinx-book-theme==1.2.0", "sphinx-design==0.7.0",
    "sphinx-copybutton==0.5.2", "sphinx-autodoc-typehints==3.5.2", "breathe==4.36.0",
    "nbformat", "nbclient", "ipykernel", "matplotlib", "scipy", "setuptools-scm", "sphinx-sitemap>=2.6",
]
# eagle.Graph.plot: the graph drawn with matplotlib (imported only by that
# method; show()/to_mermaid()/to_dot() need nothing).
plot = ["matplotlib>=3.7"]

# The bound eagle._core graph engine is a compiled nanobind extension, so the
# wheel is per-Python/ABI (not py3-none-any). eagle._core is plain C++; the CUDA
# backend eagle/libeagle_cuda.so has no Python dependency, so it is built once
# (EAGLE_PYTHON_CUDA_PLUGIN=BUILD, EAGLE_PYTHON_SKIP_CORE=ON) and handed to every
# per-Python build as EAGLE_PYTHON_CUDA_PLUGIN=<path>; see python/CMakeLists.txt.
# The eagle C++ headers + aether come from CMAKE_PREFIX_PATH (set by CI/dev).
# The version is the latest vX.Y.Z git tag (a PR build tags its checkout first); the sdist carries it in PKG-INFO.
[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.setuptools_scm"

[tool.setuptools_scm]
root = ".."

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
wheel.packages = ["eagle"]
cmake.version = ">=3.20"
# Keep the built extension out of the pure-python source collection (a dev build
# may drop one in-tree; the wheel's copy comes from the CMake install).
sdist.exclude = ["**/*.so"]
# The README and header copies _build_backend.py makes; git-ignored, so listed.
sdist.include = ["README.md", "_sdist_include/**"]
# LICENSE/NOTICE, copied next to this pyproject.toml (the repo root's own
# copies sit one directory up, outside this package directory;
# scikit-build-core's own license-files glob cannot reach outside this
# directory). Uses the backend's own setting, not PEP 639's
# project.license-files, so `license` can keep the classic dict form the
# Apache classifier above needs.
wheel.license-files = ["LICENSE", "NOTICE"]

# macOS: the linker already drops local symbols (python/CMakeLists.txt), and `strip` on the signed extension only
# warns that it invalidates the signature (the install step signs it again).
[[tool.scikit-build.overrides]]
if.platform-system = "^darwin"
install.strip = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# cupy 14 deprecated ExternalStream in favor of Stream.from_external, but the latter
# wants a __cuda_stream__ protocol object while torch exposes a raw integer stream
# handle — so ExternalStream stays the right bridge (see interop.py). Silence the
# cosmetic per-launch DeprecationWarning it emits.
# warp (a framework under test, Python 3.14) declares a ctypes Structure with _pack_ and no _layout_ at import
filterwarnings = [
  "ignore:ExternalStream is deprecated:DeprecationWarning",
  "ignore:Due to '_pack_':DeprecationWarning:warp",
]
markers = [
    "ft: free-threading rows (need a free-threaded interpreter; skip on a GIL build)",
    "gpu: requires cupy + a CUDA GPU",
    "gpu2: requires cupy + TWO CUDA GPUs (skipped, never passed, on one)",
    "torch: requires torch (CPU or CUDA) + cupy GPU",
    "torch_gpu: requires a CUDA build of torch (skipped where torch is CPU-only)",
    "interop_matrix: interop certification matrix row (deselect explicitly via -m 'not interop_matrix'; the only sanctioned way a row may not run)",
    "mpi: needs the OPTIONAL eagle._mpi extension (eagle::exec::RankPartition; built with -DEAGLE_PYTHON_MPI). Gated exactly as the gpu/torch markers are — the module is optional BY DESIGN, so a build without an MPI legitimately cannot run these. The REFUSAL rows (a missing _mpi must name the build switch) are deliberately NOT marked and run everywhere; the distributed certification is the rank bed, tests/mpi/, which has no skip machinery at all.",
    "repo_local: venv-gate guardrail — certifies the REPOSITORY (docs/pyproject/source-as-text, or a dev-env package-presence assumption), never the installed DISTRIBUTION, so a wheel legitimately cannot carry what it checks. Deselect only in the isolated-venv leg (release.yml test-wheel, -m 'not repo_local'); the repo-rooted suite (CI, dev runs) always runs these — never deselected there. The venv leg enumerates and pins the count by collection, never a hand list.",
    "wall_clock: compares measured run times, which flip with machine load; skipped unless EAGLE_WALL_CLOCK_ROWS=1 is set (run on a quiet machine)",
]
